<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{SUBTITLE}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/theme/white.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">
<style>
  :root {
    --bg: #fbfaf8;
    --ink: #1f1d24;
    --muted: #6b6574;
    --accent: #714b67;
    --accent-soft: #f1eaf0;
    --rule: #e4e0e6;
    --code-bg: #1e1b22;
    --r-background-color: var(--bg);
    --r-main-font: "Inter", system-ui, sans-serif;
    --r-main-font-size: 28px;
    --r-main-color: var(--ink);
    --r-heading-font: "Inter", system-ui, sans-serif;
    --r-heading-color: var(--ink);
    --r-heading-font-weight: 700;
    --r-heading-text-transform: none;
    --r-heading-letter-spacing: -0.01em;
    --r-heading2-size: 1.45em;
    --r-link-color: var(--accent);
    --r-code-font: "JetBrains Mono", ui-monospace, monospace;
    --r-selection-background-color: var(--accent-soft);
  }
  body { background: var(--bg); }
  .reveal .slides { text-align: left; }
  .reveal .slides section { padding: 1.2em 0.4em 0; }
  .reveal .slides section.title { padding-top: 5.5em; }
  .reveal h2 { margin-bottom: 0.7em; border-left: 0.18em solid var(--accent); padding-left: 0.45em; }
  .reveal h2 .cont { color: var(--muted); font-weight: 400; font-size: 0.6em; }
  .reveal ul { display: block; margin-left: 1em; }
  .reveal li { margin: 0.32em 0; line-height: 1.35; }
  .reveal p { line-height: 1.4; }
  .reveal strong { color: var(--accent); }
  .reveal code { font-size: 0.86em; background: var(--accent-soft); padding: 0.05em 0.25em; border-radius: 4px; }
  .reveal pre { width: 100%; box-shadow: none; font-size: 0.62em; margin: 0.4em 0; }
  .reveal pre code { background: var(--code-bg); border-radius: 10px; padding: 0.9em 1.1em; max-height: 520px; line-height: 1.5; }
  .reveal table { font-size: 0.7em; border-collapse: collapse; margin: 0.3em 0; }
  .reveal table th { color: var(--muted); font-weight: 600; border-bottom: 2px solid var(--rule); }
  .reveal table th, .reveal table td { padding: 0.32em 0.8em; border-bottom: 1px solid var(--rule); text-align: left; }
  .reveal .mermaid { font-family: "Inter", system-ui, sans-serif; font-size: 18px; text-align: center; margin: 0 auto; }
  .reveal .mermaid svg { max-height: 560px; max-width: 100%; }
  .src-label { position: absolute; bottom: 14px; left: 22px; z-index: 30; font: 12px "JetBrains Mono", ui-monospace, monospace; color: var(--muted); }
  .reveal section.final h2 { border-left-color: #0f7b6c; }
  .reveal section.final li { font-size: 0.92em; }
  .reveal section.title h1 { font-size: 2.2em; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 0.4em; }
  .reveal section.title .sub { font-size: 1.15em; color: var(--muted); margin-bottom: 1.6em; }
  .reveal section.title .meta { font-size: 0.6em; color: var(--muted); font-family: var(--r-code-font); }
  .reveal section.title .bar { width: 4em; height: 0.25em; background: var(--accent); border-radius: 2px; margin-bottom: 1em; }
  .reveal .progress { color: var(--accent); }
  .reveal .slide-number { background: transparent; color: var(--muted); font-family: var(--r-code-font); }
</style>
</head>
<body>
<div class="reveal">
  <div class="slides">

<section class="title">
  <div class="bar"></div>
  <h1>{{TITLE}}</h1>
  <p class="sub">{{SUBTITLE}}</p>
  <p class="meta">Odoo 19.0 EE &middot; checked against odoo/odoo@e6ebad8 and the concurrency_retry_demo module &middot; built {{BUILT}}</p>
</section>

{{SLIDES}}

  </div>
  <div class="src-label"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/dist/reveal.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/plugin/markdown/markdown.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/plugin/highlight/highlight.js"></script>
<script src="https://cdn.jsdelivr.net/npm/reveal.js@5.2.1/plugin/notes/notes.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script>
  mermaid.initialize({
    startOnLoad: false,
    theme: "base",
    themeVariables: {
      fontFamily: "Inter, system-ui, sans-serif",
      fontSize: "18px",
      primaryColor: "#f1eaf0",
      primaryBorderColor: "#714b67",
      primaryTextColor: "#1f1d24",
      lineColor: "#6b6574",
      secondaryColor: "#e7f4f1",
      tertiaryColor: "#fbfaf8",
    },
    // SVG text labels: HTML labels are measured with the slide's CSS scale
    // applied, and come out clipped.
    htmlLabels: false,
    flowchart: { curve: "basis", htmlLabels: false, nodeSpacing: 28, rankSpacing: 34 },
  });

  // Mermaid measures text, which fails inside hidden slides and before the
  // web fonts are loaded: render each diagram when its slide is shown.
  async function renderMermaid(slide) {
    const nodes = slide ? slide.querySelectorAll(".mermaid:not([data-processed])") : [];
    if (nodes.length) {
      await document.fonts.ready;
      await mermaid.run({ nodes: Array.from(nodes) });
      Reveal.layout();
    }
  }

  // The note a slide comes from, in the bottom-left corner.
  function showSource(slide) {
    document.querySelector(".src-label").textContent = (slide && slide.dataset.source) || "";
  }

  Reveal.initialize({
    hash: true,
    slideNumber: "c/t",
    width: 1280,
    height: 720,
    margin: 0.06,
    center: false,
    transition: "fade",
    transitionSpeed: "fast",
    plugins: [RevealMarkdown, RevealHighlight, RevealNotes],
  }).then(() => {
    showSource(Reveal.getCurrentSlide());
    renderMermaid(Reveal.getCurrentSlide());
  });
  Reveal.on("slidechanged", (event) => {
    showSource(event.currentSlide);
    renderMermaid(event.currentSlide);
  });
</script>
</body>
</html>
